<!DOCTYPE html>
<html>
<head>
    <title>Phone Call Fraud Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;  
            align-items: center;  
            background-image: url("{{ url_for('static', filename='bg.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        .container {
            text-align: center;
        }
        h2 
        { 
            color: #c0392b;
            margin-bottom: 20px;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0px 0px 10px #aaa;
        }
        input[type="text"], input[type="submit"] {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="d-flex flex-row justify-content-center">
    <h2>📞 Phone Call Fraud Detection</h2>
    <form method="POST" action="/predict">
        <label>Duration (seconds):</label><br>
        <input type="text" name="duration" required><br>

        <label>Call Type (0=Local, 1=STD):</label><br>
        <input type="text" name="call_type" required><br>

        <label>International Call (0=No, 1=Yes):</label><br>
        <input type="text" name="is_international" required><br>

        <input type="submit" value="Check Risk">
    </form>

    {% if prediction_text %}
        <div class="result\n">{{ prediction_text }}</div>
    {% endif %}
    </div>
</body>
</html>
